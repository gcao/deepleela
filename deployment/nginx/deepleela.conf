upstream deepleela {
    server localhost:3000;
}

server {
    listen 8080;
    server_name www.daoqi.org;
    root /home/gcao/prod/deepleela/build;

    location / {
        try_files $uri $uri/ /index.html =404;
        # proxy_pass http://deepleela;
        # proxy_http_version 1.1;
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection "upgrade";
    }
}

upstream deepleela-dev {
    server localhost:3030;
}

server {
    listen 8081;
    server_name www.daoqi.org;

    location / {
        try_files $uri $uri/ /index.html =404;
        proxy_pass http://deepleela-dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

